<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Style 13: Signal/pulse radiating from a point — deal alerts -->
  <rect width="400" height="400" rx="40" fill="#0B1622"/>
  <!-- Radiating arcs -->
  <path d="M200 180 m-80,0 a80,80 0 0,1 160,0" fill="none" stroke="#E8EAED" stroke-width="2" opacity="0.12"/>
  <path d="M200 180 m-58,0 a58,58 0 0,1 116,0" fill="none" stroke="#E8EAED" stroke-width="2" opacity="0.25"/>
  <path d="M200 180 m-36,0 a36,36 0 0,1 72,0" fill="none" stroke="#E8EAED" stroke-width="2.5" opacity="0.45"/>
  <!-- Center dot -->
  <circle cx="200" cy="180" r="8" fill="#E8EAED"/>
  <!-- Baseline -->
  <line x1="110" y1="180" x2="290" y2="180" stroke="#E8EAED" stroke-width="1" opacity="0.1"/>
  <text x="200" y="290" text-anchor="middle" fill="#E8EAED" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="-1.5">HorizonsAI</text>
  <text x="200" y="318" text-anchor="middle" fill="#7B8FA3" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" letter-spacing="3">DEAL INTELLIGENCE</text>
</svg>

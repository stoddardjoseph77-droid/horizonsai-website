<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Horizontal stacked layers — like data strata being mined -->
  <rect width="400" height="400" rx="40" fill="#0B1622"/>
  <!-- Stacked horizontal rounded bars, slightly offset -->
  <rect x="130" y="110" width="160" height="24" rx="8" fill="none" stroke="#E8EAED" stroke-width="2.5" opacity="0.12"/>
  <rect x="125" y="142" width="160" height="24" rx="8" fill="none" stroke="#E8EAED" stroke-width="2.5" opacity="0.25"/>
  <rect x="120" y="174" width="160" height="24" rx="8" fill="none" stroke="#E8EAED" stroke-width="2.5" opacity="0.45"/>
  <rect x="115" y="206" width="160" height="24" rx="8" fill="none" stroke="#E8EAED" stroke-width="3" opacity="0.7"/>
  <rect x="110" y="238" width="160" height="24" rx="8" fill="#E8EAED" stroke="#E8EAED" stroke-width="3" opacity="0.08"/>
  <rect x="110" y="238" width="160" height="24" rx="8" fill="none" stroke="#E8EAED" stroke-width="3"/>
  <!-- Arrow pulling bottom layer out -->
  <line x1="280" y1="250" x2="310" y2="250" stroke="#E8EAED" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <polyline points="302,242 314,250 302,258" fill="none" stroke="#E8EAED" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  <text x="200" y="325" text-anchor="middle" fill="#E8EAED" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="-1.5">HorizonsAI</text>
  <text x="200" y="353" text-anchor="middle" fill="#7B8FA3" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" letter-spacing="3">DEAL INTELLIGENCE</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Offset layered rectangles — like stacked reports/deals being surfaced -->
  <rect width="400" height="400" rx="40" fill="#0B1622"/>
  <!-- Back card -->
  <rect x="150" y="105" width="130" height="90" rx="14" fill="none" stroke="#E8EAED" stroke-width="2.5" opacity="0.15"/>
  <!-- Middle card -->
  <rect x="135" y="130" width="130" height="90" rx="14" fill="none" stroke="#E8EAED" stroke-width="2.5" opacity="0.4"/>
  <!-- Front card — the surfaced deal -->
  <rect x="120" y="155" width="130" height="90" rx="14" fill="none" stroke="#E8EAED" stroke-width="3"/>
  <!-- Small detail lines inside front card — like data rows -->
  <line x1="140" y1="182" x2="210" y2="182" stroke="#E8EAED" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  <line x1="140" y1="196" x2="190" y2="196" stroke="#E8EAED" stroke-width="2" opacity="0.25" stroke-linecap="round"/>
  <line x1="140" y1="210" x2="200" y2="210" stroke="#E8EAED" stroke-width="2" opacity="0.15" stroke-linecap="round"/>
  <!-- Forward chevron beside the stack -->
  <polyline points="270,170 290,190 270,210" fill="none" stroke="#E8EAED" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  <text x="200" y="310" text-anchor="middle" fill="#E8EAED" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="-1.5">HorizonsAI</text>
  <text x="200" y="338" text-anchor="middle" fill="#7B8FA3" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" letter-spacing="3">DEAL INTELLIGENCE</text>
</svg>

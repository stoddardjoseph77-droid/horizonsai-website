<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Squares in perspective — like looking down a corridor/pipeline toward the horizon -->
  <rect width="400" height="400" rx="40" fill="#0B1622"/>
  <!-- Outer -->
  <rect x="110" y="90" width="180" height="180" rx="20" fill="none" stroke="#E8EAED" stroke-width="2" opacity="0.1"/>
  <!-- Next -->
  <rect x="132" y="112" width="136" height="136" rx="16" fill="none" stroke="#E8EAED" stroke-width="2" opacity="0.2"/>
  <!-- Next -->
  <rect x="154" y="134" width="92" height="92" rx="12" fill="none" stroke="#E8EAED" stroke-width="2.5" opacity="0.4"/>
  <!-- Next -->
  <rect x="174" y="154" width="52" height="52" rx="8" fill="none" stroke="#E8EAED" stroke-width="3" opacity="0.7"/>
  <!-- Center — the opportunity -->
  <rect x="191" y="171" width="18" height="18" rx="4" fill="#E8EAED"/>
  <!-- Connecting corner lines for perspective depth -->
  <line x1="110" y1="90" x2="191" y2="171" stroke="#E8EAED" stroke-width="1" opacity="0.06"/>
  <line x1="290" y1="90" x2="209" y2="171" stroke="#E8EAED" stroke-width="1" opacity="0.06"/>
  <line x1="290" y1="270" x2="209" y2="189" stroke="#E8EAED" stroke-width="1" opacity="0.06"/>
  <line x1="110" y1="270" x2="191" y2="189" stroke="#E8EAED" stroke-width="1" opacity="0.06"/>
  <text x="200" y="330" text-anchor="middle" fill="#E8EAED" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="-1.5">HorizonsAI</text>
  <text x="200" y="358" text-anchor="middle" fill="#7B8FA3" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" letter-spacing="3">DEAL INTELLIGENCE</text>
</svg>

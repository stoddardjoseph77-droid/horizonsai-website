<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" rx="40" fill="#0B1622"/>
  <!-- Circle (like a score ring) with horizontal line extending from it -->
  <!-- Outer ring -->
  <circle cx="165" cy="180" r="40" fill="none" stroke="#E8EAED" stroke-width="4"/>
  <!-- Partial fill arc (like a score) -->
  <circle cx="165" cy="180" r="40" fill="none" stroke="#E8EAED" stroke-width="4"
    stroke-dasharray="220" stroke-dashoffset="45"
    transform="rotate(-90 165 180)" stroke-linecap="round" opacity="0.3"/>
  <!-- Inner text -->
  <text x="165" y="186" text-anchor="middle" fill="#E8EAED" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800">H</text>
  <!-- Horizon line extending right -->
  <line x1="210" y1="180" x2="310" y2="180" stroke="#E8EAED" stroke-width="3" stroke-linecap="round"/>
  <!-- Small terminal dot -->
  <circle cx="310" cy="180" r="4" fill="#E8EAED" opacity="0.4"/>
  <text x="200" y="290" text-anchor="middle" fill="#E8EAED" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="-1.5">HorizonsAI</text>
  <text x="200" y="318" text-anchor="middle" fill="#7B8FA3" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" letter-spacing="3">DEAL INTELLIGENCE</text>
</svg>

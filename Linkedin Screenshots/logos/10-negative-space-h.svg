<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" rx="40" fill="#0B1622"/>
  <!-- Solid rounded square with H cut out as negative space -->
  <defs>
    <mask id="h-mask">
      <rect x="110" y="95" width="180" height="180" rx="28" fill="white"/>
      <!-- Cut out the H -->
      <rect x="140" y="115" width="22" height="140" rx="2" fill="black"/>
      <rect x="238" y="115" width="22" height="140" rx="2" fill="black"/>
      <rect x="162" y="175" width="76" height="20" rx="2" fill="black"/>
    </mask>
  </defs>
  <rect x="110" y="95" width="180" height="180" rx="28" fill="#E8EAED" mask="url(#h-mask)"/>
  <text x="200" y="335" text-anchor="middle" fill="#E8EAED" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" letter-spacing="-1.5">HorizonsAI</text>
</svg>

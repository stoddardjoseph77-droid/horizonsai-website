<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Geist+Mono&display=swap');
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #000;
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .banner {
    width: 1128px; height: 191px;
    background: linear-gradient(135deg, #0B1622 0%, #0f1f33 50%, #0B1622 100%);
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .banner::before {
    content: ''; position: absolute; inset: 0; opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    z-index: 1; pointer-events: none;
  }
  .banner::after {
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 48px 48px; z-index: 0; pointer-events: none;
  }
  .glow {
    position: absolute; width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(232,234,237,0.03) 0%, transparent 60%);
    top: -200px; right: 200px; z-index: 0;
  }

  /* ── TOP BAR (above logo overlap) ── */
  .top-bar {
    position: relative; z-index: 10;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 28px 0 28px;
  }
  .stat-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 6px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
  }
  .stat-val {
    font-size: 13px; font-weight: 800; color: #FFFFFF;
    font-family: 'Geist Mono', monospace;
  }
  .stat-label { font-size: 9px; color: #9CAAB8; font-weight: 500; }

  .content {
    position: relative; z-index: 10;
    flex: 1;
    display: flex;
    align-items: center;
    padding: 0 28px 14px 220px;
    gap: 32px;
  }

  /* ── CENTER: Headline ── */
  .text-center-area { flex: 1; min-width: 0; }
  h1 {
    font-size: 38px; font-weight: 700; color: #FFFFFF;
    line-height: 1.0; letter-spacing: -0.04em; margin-bottom: 10px;
  }
  .cta-row { display: flex; align-items: center; gap: 14px; }
  .cta-btn {
    padding: 8px 24px; background: #E8EAED; color: #0B1622;
    font-size: 14px; font-weight: 700; border-radius: 8px;
    box-shadow: 0 0 16px rgba(232,234,237,0.12), 0 0 40px rgba(232,234,237,0.04);
    display: inline-flex; align-items: center;
  }
  .url { font-size: 12px; color: rgba(156,170,184,0.45); font-weight: 500; }

  /* ── RIGHT: Simplified mockup card ── */
  .mockup {
    flex-shrink: 0;
    width: 320px;
    background: rgba(19,33,54,0.6);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px; overflow: hidden;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 16px 32px -8px rgba(0,0,0,0.4);
  }
  .m-header {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .m-source {
    color: #FFFFFF; background: rgba(232,234,237,0.1);
    padding: 2px 8px; border-radius: 4px; font-weight: 600; font-size: 10px;
  }
  .m-title { color: #FFFFFF; font-weight: 600; font-size: 12px; }
  .m-loc {
    color: rgba(156,170,184,0.5); margin-left: auto;
    font-family: 'Geist Mono', monospace; font-size: 10px;
  }

  .m-body {
    padding: 10px 14px;
    display: flex; align-items: center; gap: 12px;
  }

  .score-ring { width: 56px; height: 56px; flex-shrink: 0; position: relative; }
  .score-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .score-ring-val {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .score-num {
    font-size: 18px; font-weight: 800; color: #10B981;
    font-family: 'Geist Mono', monospace; line-height: 1;
  }
  .score-label {
    font-size: 6px; color: rgba(156,170,184,0.6);
    text-transform: uppercase; letter-spacing: 0.08em; margin-top: 1px;
  }

  .mini-metrics { display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .mini-row { display: flex; justify-content: space-between; }
  .mm-label { font-size: 9px; color: rgba(156,170,184,0.5); text-transform: uppercase; letter-spacing: 0.04em; }
  .mm-val { font-size: 11px; color: #FFFFFF; font-weight: 700; font-family: 'Geist Mono', monospace; }

  .confidence-badge {
    display: inline-block;
    background: rgba(16,185,129,0.12); color: #10B981;
    font-size: 9px; font-weight: 700; text-transform: uppercase;
    padding: 2px 8px; border-radius: 4px; margin-bottom: 4px;
  }

  /* ── AI pill ── */
  .ai-pill {
    margin-left: auto;
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 12px; border-radius: 100px;
    background: rgba(16,185,129,0.08);
    border: 1px solid rgba(16,185,129,0.15);
  }
  .ai-dot { width: 5px; height: 5px; border-radius: 50%; background: #10B981; }
  .ai-text { font-size: 10px; font-weight: 600; color: #10B981; }
</style>
</head>
<body>
<div class="banner">
  <div class="glow"></div>

  <div class="top-bar">
    <div class="stat-pill">
      <span class="stat-val">$5T+</span>
      <span class="stat-label">CRE Debt Monitored</span>
    </div>
    <div class="stat-pill">
      <span class="stat-val">2,800+</span>
      <span class="stat-label">Opportunities Surfaced</span>
    </div>
    <div class="stat-pill">
      <span class="stat-val">50+</span>
      <span class="stat-label">Data Sources</span>
    </div>
    <div class="ai-pill">
      <div class="ai-dot"></div>
      <span class="ai-text">AI Deal Intelligence</span>
    </div>
  </div>

  <div class="content">
    <div class="text-center-area">
      <h1>Source Off-Market Deals<br>Before They Hit the Market</h1>
      <div class="cta-row">
        <div class="cta-btn">Book a Call</div>
        <span class="url">horizonsai.co</span>
      </div>
    </div>

    <div class="mockup">
      <div class="m-header">
        <span class="m-source">CMBS</span>
        <span class="m-title">Apex Centre Tower</span>
        <span class="m-loc">Dallas, TX</span>
      </div>
      <div class="m-body">
        <div class="score-ring">
          <svg viewBox="0 0 56 56">
            <circle cx="28" cy="28" r="23" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="3"/>
            <circle cx="28" cy="28" r="23" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-dasharray="144.5" stroke-dashoffset="18.8"/>
          </svg>
          <div class="score-ring-val">
            <span class="score-num">87</span>
            <span class="score-label">Score</span>
          </div>
        </div>
        <div class="mini-metrics">
          <div class="confidence-badge">High Confidence</div>
          <div class="mini-row"><span class="mm-label">Loan Bal</span><span class="mm-val">$18.2M</span></div>
          <div class="mini-row"><span class="mm-label">Occupancy</span><span class="mm-val">58%</span></div>
          <div class="mini-row"><span class="mm-label">DSCR</span><span class="mm-val">0.72x</span></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>

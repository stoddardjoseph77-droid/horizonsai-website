<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Style 16: Half circle rising over a line — sunrise/horizon, filled -->
  <rect width="400" height="400" rx="40" fill="#0B1622"/>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8EAED" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E8EAED" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- Semi-circle -->
  <path d="M130 210 A70 70 0 0 1 270 210" fill="url(#fade)"/>
  <!-- Horizon line -->
  <line x1="90" y1="210" x2="310" y2="210" stroke="#E8EAED" stroke-width="3" stroke-linecap="round"/>
  <!-- Rays above -->
  <line x1="200" y1="105" x2="200" y2="125" stroke="#E8EAED" stroke-width="2" opacity="0.2" stroke-linecap="round"/>
  <line x1="140" y1="125" x2="148" y2="140" stroke="#E8EAED" stroke-width="2" opacity="0.15" stroke-linecap="round"/>
  <line x1="260" y1="125" x2="252" y2="140" stroke="#E8EAED" stroke-width="2" opacity="0.15" stroke-linecap="round"/>
  <text x="200" y="290" text-anchor="middle" fill="#E8EAED" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="-1.5">HorizonsAI</text>
  <text x="200" y="318" text-anchor="middle" fill="#7B8FA3" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" letter-spacing="3">DEAL INTELLIGENCE</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Style 20: Rotated square (diamond) with inner lines — premium, jewelry-like -->
  <rect width="400" height="400" rx="40" fill="#0B1622"/>
  <!-- Outer diamond -->
  <rect x="145" y="120" width="110" height="110" rx="8" fill="none" stroke="#E8EAED" stroke-width="3.5" transform="rotate(45 200 175)"/>
  <!-- Inner diamond, smaller -->
  <rect x="170" y="145" width="60" height="60" rx="4" fill="none" stroke="#E8EAED" stroke-width="2" opacity="0.3" transform="rotate(45 200 175)"/>
  <!-- Center dot -->
  <circle cx="200" cy="175" r="4" fill="#E8EAED"/>
  <text x="200" y="310" text-anchor="middle" fill="#E8EAED" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="-1.5">HorizonsAI</text>
  <text x="200" y="338" text-anchor="middle" fill="#7B8FA3" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" letter-spacing="3">DEAL INTELLIGENCE</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" rx="40" fill="#0B1622"/>
  <!-- H with a gap in the crossbar — horizon cutting through -->
  <!-- Left vertical -->
  <rect x="135" y="110" width="16" height="180" rx="2" fill="#E8EAED"/>
  <!-- Right vertical -->
  <rect x="249" y="110" width="16" height="180" rx="2" fill="#E8EAED"/>
  <!-- Crossbar left half -->
  <rect x="151" y="192" width="40" height="16" rx="2" fill="#E8EAED"/>
  <!-- Crossbar right half -->
  <rect x="209" y="192" width="40" height="16" rx="2" fill="#E8EAED"/>
  <!-- Gap in center = the horizon / viewport -->
  <!-- Subtle glow in the gap -->
  <rect x="193" y="195" width="14" height="10" rx="5" fill="#E8EAED" opacity="0.12"/>
  <text x="200" y="340" text-anchor="middle" fill="#E8EAED" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" letter-spacing="-1.5">HorizonsAI</text>
</svg>

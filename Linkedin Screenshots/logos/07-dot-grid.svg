<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" rx="40" fill="#0B1622"/>
  <!-- 4 dots in a grid with connecting lines — network/constellation -->
  <!-- Connecting lines first (behind dots) -->
  <line x1="160" y1="140" x2="240" y2="140" stroke="#E8EAED" stroke-width="1.5" opacity="0.2"/>
  <line x1="160" y1="140" x2="160" y2="220" stroke="#E8EAED" stroke-width="1.5" opacity="0.2"/>
  <line x1="240" y1="140" x2="240" y2="220" stroke="#E8EAED" stroke-width="1.5" opacity="0.2"/>
  <line x1="160" y1="220" x2="240" y2="220" stroke="#E8EAED" stroke-width="1.5" opacity="0.2"/>
  <!-- Diagonal -->
  <line x1="160" y1="140" x2="240" y2="220" stroke="#E8EAED" stroke-width="1.5" opacity="0.1"/>
  <!-- Nodes -->
  <circle cx="160" cy="140" r="8" fill="#E8EAED"/>
  <circle cx="240" cy="140" r="8" fill="#E8EAED"/>
  <circle cx="160" cy="220" r="8" fill="#E8EAED" opacity="0.5"/>
  <circle cx="240" cy="220" r="12" fill="#E8EAED"/>
  <!-- Outer ring on primary node -->
  <circle cx="240" cy="220" r="18" fill="none" stroke="#E8EAED" stroke-width="1.5" opacity="0.2"/>
  <text x="200" y="300" text-anchor="middle" fill="#E8EAED" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="-1.5">HorizonsAI</text>
  <text x="200" y="328" text-anchor="middle" fill="#7B8FA3" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" letter-spacing="3">DEAL INTELLIGENCE</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Horizontal chevrons like a pipeline flow — data sources > enrichment > delivery -->
  <rect width="400" height="400" rx="40" fill="#0B1622"/>
  <polyline points="110,140 145,175 110,210" fill="none" stroke="#E8EAED" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.15"/>
  <polyline points="155,140 190,175 155,210" fill="none" stroke="#E8EAED" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
  <polyline points="200,140 235,175 200,210" fill="none" stroke="#E8EAED" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  <polyline points="245,140 280,175 245,210" fill="none" stroke="#E8EAED" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <!-- Terminal dot — the delivered deal -->
  <circle cx="300" cy="175" r="7" fill="#E8EAED"/>
  <text x="200" y="295" text-anchor="middle" fill="#E8EAED" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="-1.5">HorizonsAI</text>
  <text x="200" y="323" text-anchor="middle" fill="#7B8FA3" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" letter-spacing="3">DEAL INTELLIGENCE</text>
</svg>

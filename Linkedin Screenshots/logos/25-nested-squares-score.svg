<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Nested squares converging to center dot — like scoring/zeroing in on a deal -->
  <rect width="400" height="400" rx="40" fill="#0B1622"/>
  <rect x="115" y="90" width="170" height="170" rx="24" fill="none" stroke="#E8EAED" stroke-width="2.5" opacity="0.12"/>
  <rect x="140" y="115" width="120" height="120" rx="18" fill="none" stroke="#E8EAED" stroke-width="2.5" opacity="0.3"/>
  <rect x="165" y="140" width="70" height="70" rx="12" fill="none" stroke="#E8EAED" stroke-width="3" opacity="0.6"/>
  <!-- Center — the deal found -->
  <circle cx="200" cy="175" r="8" fill="#E8EAED"/>
  <text x="200" y="320" text-anchor="middle" fill="#E8EAED" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="-1.5">HorizonsAI</text>
  <text x="200" y="348" text-anchor="middle" fill="#7B8FA3" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" letter-spacing="3">DEAL INTELLIGENCE</text>
</svg>

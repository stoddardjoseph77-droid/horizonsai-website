<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Layered parallelograms — like cards being dealt/surfaced with forward motion -->
  <rect width="400" height="400" rx="40" fill="#0B1622"/>
  <!-- Back layer -->
  <path d="M155 120 L275 120 L260 240 L140 240 Z" fill="none" stroke="#E8EAED" stroke-width="2.5" stroke-linejoin="round" opacity="0.12"/>
  <!-- Middle layer -->
  <path d="M145 130 L265 130 L250 245 L130 245 Z" fill="none" stroke="#E8EAED" stroke-width="2.5" stroke-linejoin="round" opacity="0.35"/>
  <!-- Front layer -->
  <path d="M135 140 L255 140 L240 250 L120 250 Z" fill="none" stroke="#E8EAED" stroke-width="3" stroke-linejoin="round"/>
  <!-- Data lines on front card -->
  <line x1="148" y1="170" x2="218" y2="170" stroke="#E8EAED" stroke-width="2.5" opacity="0.5" stroke-linecap="round"/>
  <line x1="146" y1="190" x2="196" y2="190" stroke="#E8EAED" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  <line x1="144" y1="210" x2="206" y2="210" stroke="#E8EAED" stroke-width="2" opacity="0.2" stroke-linecap="round"/>
  <text x="200" y="315" text-anchor="middle" fill="#E8EAED" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="-1.5">HorizonsAI</text>
  <text x="200" y="343" text-anchor="middle" fill="#7B8FA3" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" letter-spacing="3">DEAL INTELLIGENCE</text>
</svg>

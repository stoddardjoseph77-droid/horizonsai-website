<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" rx="40" fill="#0B1622"/>
  <!-- Pure wordmark, tight tracking, AI dimmed -->
  <text x="200" y="195" text-anchor="middle" fill="#E8EAED" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-3">Horizons</text>
  <text x="308" y="195" text-anchor="start" fill="#7B8FA3" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-3">AI</text>
  <!-- Thin underline -->
  <line x1="100" y1="215" x2="300" y2="215" stroke="#E8EAED" stroke-width="1.5" opacity="0.15"/>
  <text x="200" y="245" text-anchor="middle" fill="#7B8FA3" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" letter-spacing="5">DEAL INTELLIGENCE</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Style 19: Orbital ring around a dot — satellite/scanning -->
  <rect width="400" height="400" rx="40" fill="#0B1622"/>
  <!-- Tilted ellipse orbit -->
  <ellipse cx="200" cy="175" rx="80" ry="30" fill="none" stroke="#E8EAED" stroke-width="2.5" transform="rotate(-20 200 175)" opacity="0.3"/>
  <ellipse cx="200" cy="175" rx="80" ry="30" fill="none" stroke="#E8EAED" stroke-width="2.5" transform="rotate(25 200 175)" opacity="0.2"/>
  <!-- Center sphere -->
  <circle cx="200" cy="175" r="20" fill="#E8EAED" opacity="0.1"/>
  <circle cx="200" cy="175" r="20" fill="none" stroke="#E8EAED" stroke-width="2.5"/>
  <!-- Orbiting dot -->
  <circle cx="275" cy="158" r="5" fill="#E8EAED"/>
  <text x="200" y="290" text-anchor="middle" fill="#E8EAED" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="-1.5">HorizonsAI</text>
  <text x="200" y="318" text-anchor="middle" fill="#7B8FA3" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" letter-spacing="3">DEAL INTELLIGENCE</text>
</svg>

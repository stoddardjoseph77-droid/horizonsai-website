<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" rx="40" fill="#0B1622"/>
  <!-- Single rising diagonal line with node at peak -->
  <polyline points="100,240 180,210 230,225 320,140"
    fill="none" stroke="#E8EAED" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Peak dot -->
  <circle cx="320" cy="140" r="7" fill="#E8EAED"/>
  <circle cx="320" cy="140" r="12" fill="none" stroke="#E8EAED" stroke-width="1.5" opacity="0.25"/>
  <!-- Baseline -->
  <line x1="100" y1="260" x2="320" y2="260" stroke="#E8EAED" stroke-width="1" opacity="0.1"/>
  <text x="200" y="320" text-anchor="middle" fill="#E8EAED" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="-1.5">HorizonsAI</text>
  <text x="200" y="348" text-anchor="middle" fill="#7B8FA3" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" letter-spacing="3">DEAL INTELLIGENCE</text>
</svg>
